<div class="relative min-h-screen bg-zinc-950 flex items-center justify-center overflow-hidden pt-24 md:pt-32 pb-16">
  
  <!-- 1. EL VIDEO DE FONDO -->
  <video autoplay loop muted [muted]="true" playsinline class="absolute top-0 left-0 w-full h-full object-cover z-0 opacity-30">
    <source src="/mecanica.mp4" type="video/mp4">
    Tu navegador no soporta videos.
  </video>  

  <!-- 2. La capa roja (ahora se mezcla con el video) -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-1/2 md:w-3/4 md:h-3/4 bg-red-600/30 blur-[100px] md:blur-[120px] rounded-full z-0 pointer-events-none"></div>

  <!-- 3. El Contenido Frontal -->
  <div class="relative z-10 text-center px-4 sm:px-6 max-w-5xl mx-auto flex flex-col items-center">
    
    <!-- TÍTULO: Ajustado para que la palabra larga no rompa la pantalla en celular -->
    <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-br from-red-500 to-orange-700 italic tracking-tighter mb-4 md:mb-6 drop-shadow-lg leading-tight">
      PerformanceRozRz
    </h1>
    
    <!-- PÁRRAFO: Texto amigable para lectura móvil -->
    <p class="text-zinc-300 text-base sm:text-lg md:text-2xl font-light mb-8 md:mb-10 max-w-2xl mx-auto drop-shadow-md">
      Potencia, precisión y alto rendimiento. Mecánica especializada, diésel, gasolina y estética automotriz premium.
    </p>
    
    <!-- BOTONES: Botón gigante en móvil para clics fáciles, tamaño normal en PC -->
    <div class="flex flex-col sm:flex-row gap-4 md:gap-5 justify-center w-full sm:w-auto">
      <a href="#contacto" class="block w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-bold py-3 md:py-4 px-6 md:px-10 rounded-lg uppercase tracking-widest transition-all duration-300 transform hover:-translate-y-1 shadow-[0_0_20px_rgba(220,38,38,0.4)] hover:shadow-[0_0_30px_rgba(220,38,38,0.6)] text-center backdrop-blur-sm">
        Cotizar Servicio
      </a>
    </div>
    
  </div>
</div>
